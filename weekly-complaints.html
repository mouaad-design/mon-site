<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard documents des reclamations hebdomadaires Versigent.">
  <title>Op2Qual Plateforme - Reclamations cette semaine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<body class="client-select-page weekly-complaints-page">
  <div class="hero-bg">
    <div class="hero-rotator" aria-hidden="true">
      <div class="hero-slide hero-slide--dashboard-stellantis"></div>
      <div class="hero-slide hero-slide--dashboard-volvo"></div>
      <div class="hero-slide hero-slide--dashboard-tesla"></div>
    </div>
    <div class="hero-overlay"></div>
  </div>

  <main class="client-select-main">
    <section class="client-select-shell intro-rise delay-1">
      <div class="client-select-copy">
        <p class="client-select-kicker" data-i18n="weeklyComplaintsKicker">Dashboard Versigent</p>

      <div class="client-grid client-grid--weekly-documents">

          <span class="weekly-document-card__badge" data-i18n="supportPriorityFormal">Formel</span>

        <button type="button" class="client-card weekly-document-card weekly-document-card--informal reveal-section" data-doc-action data-doc-static-client="true" data-doc-client="versigent" data-doc-section="complaints-informal">
          <span class="weekly-document-card__badge" data-i18n="supportPriorityInformal">Informel</span>
        </button>
      </div>
    </section>
  </main>

  <script src="./translations.js?v=20260511-weekly-complaint-theme"></script>
